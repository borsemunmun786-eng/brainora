services:
  - type: web
    name: brainora
    runtime: python
    buildCommand: "pip install -r requirements.txt && python setup_nltk.py"
    startCommand: "gunicorn wsgi:application --workers 1 --timeout 120"
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
